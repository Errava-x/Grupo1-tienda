spring.application.name=tiendaTech

#para definir el puerto donde "escuchará" el servidor

server.port=5050
 
#Para definir el formato de despliegue de fecha/hora del log en la consola

logging.pattern.dateformat=hh:mm
 
#Para eliminar mensajes invasivos de Spring

spring.main.banner-mode=off
 
#En desarrollo el "cache" del servidor (false), en producción "true"

spring.thymeleaf.cache=false
 
#Mysql conexion

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/techshop
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
#mostrar información en el log

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

#Acceso al storage de FireBase

firebase.bucket.name=techshop-c6559.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file=techshop-c6559-firebase-adminsdk-fbsvc-186bc10e5d.json
